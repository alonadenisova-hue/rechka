# Сервер ИИ‑Шарика. Выкладка: см. README.md в этой папке.
name = "rechka-sharik"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-opus-5-5"
EFFORT = "low"
DAILY_LIMIT = "600"
STT_LIMIT = "400"
# адреса сайта «Речки» через запятую (пусто — разрешить всем, только для проверки)
ALLOWED_ORIGINS = ""

# Счётчик обращений за день (чтобы не потратить лишнего). Создать: npx wrangler kv namespace create USAGE
# и вписать id ниже, затем раскомментировать.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "…"

# Распознавание речи для /stt (Whisper на Cloudflare Workers AI). Отдельный ключ не нужен,
# бесплатной дневной квоты Workers AI хватает на занятия. Без этой привязки /stt отвечает note: "no_ai".
[ai]
binding = "AI"
